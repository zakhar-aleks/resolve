services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - resolve_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resolve -d resolve']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  resolve_data:

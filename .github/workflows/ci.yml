name: Quality
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U resolve -d resolve"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  container:
    env:
      POSTGRES_DATA_PATH: /tmp/resolve-postgres-ci
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p /tmp/resolve-postgres-ci
      - run: node scripts/deployment-env.mjs ci.example.invalid
      - run: docker compose --env-file .env.deploy -f compose.deploy.yaml config --quiet
      - run: docker compose --env-file .env.deploy -f compose.deploy.yaml up -d --build --wait --wait-timeout 180 app postgres
      - name: Check private boundaries inside container
        run: >-
          docker compose --env-file .env.deploy -f compose.deploy.yaml exec -T app
          node --input-type=module -e
          "for (const url of ['http://127.0.0.1:8787/?view=support','http://127.0.0.1:8787/fragments/workspace','http://127.0.0.1:8788/api/state']) { const r = await fetch(url, {redirect:'manual'}); if (r.status !== (url.includes(':8787') ? 303 : 401)) throw new Error('Private route exposed: ' + url); }"
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.deploy -f compose.deploy.yaml down
